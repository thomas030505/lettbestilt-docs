# Fern overrides for the API reference.
#
# `openapi.json` next to this file is a verbatim copy of the platform spec
# (`src/app/api/v1/openapi.json/route.ts` in the platform repo), and the platform
# spec is the source of every text: summaries, descriptions and parameter and
# field descriptions are written in English there (decision 20.10.2026). Do not
# add text overrides here; change the text in the platform spec and copy it over.
#
# What this file still adds:
# - tags: the section tags and their descriptions, and the tag of every
#   operation;
# - operationId on every operation, and x-fern-type-name on some schemas
#   (names in generated SDKs);
# - request and response examples;
# - error responses the platform spec does not list yet, the webhook
#   reference (`webhooks` and the *Data schemas) and the webhook header
#   parameters. These are additions, not translations; they belong in the
#   platform spec and should move there in a later round.
#
# How Fern merges this file into the spec (fern-api 5.152.2):
# - Objects are deep-merged; keys here win.
# - `parameters` are matched by `in` + `name`, so order does not matter.
# - Other arrays of objects (`oneOf`, `servers`, `tags`) are merged by index.
#   The platform spec has one tag, Partner, at index 0; it is listed first
#   here by name only, so its description comes from the platform spec.
# - Arrays of plain values (`enum`, `tags` on an operation, `required`) are replaced.

tags:
  - name: Partner
  - name: Restaurant and menu
    description: The restaurant's profile, capabilities, menu and current preparation time.
  - name: Orders
    description: Create takeaway orders, track them and look up delivery addresses.
  - name: Reservations
    description: Offer reservation times and send table reservation requests.
  - name: Coupons and newsletter
    description: >-
      Validate coupon codes, preview automatic promotions and sign customers up for the restaurant's
      newsletter.
  - name: Website
    description: Settings for the restaurant's own website.
  - name: Webhooks
    description: >-
      Events LettBestilt sends to your endpoint. Every delivery is signed; see the [webhooks guide](/webhooks)
      for how to verify it.
paths:
  /api/v1/restaurant:
    get:
      operationId: getRestaurant
      tags:
        - Restaurant and menu
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  restaurant:
                    x-fern-type-name: Restaurant
  /api/v1/menu:
    get:
      operationId: getMenu
      tags:
        - Restaurant and menu
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  restaurant:
                    x-fern-type-name: MenuRestaurant
                  categories:
                    items:
                      x-fern-type-name: Category
                  upsell:
                    x-fern-type-name: Upsell
                    properties:
                      products:
                        items:
                          x-fern-type-name: UpsellProduct
        "400":
          description: "`MISSING_SLUG`: the `slug` query parameter is missing."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/prep-time:
    get:
      operationId: getPrepTime
      tags:
        - Restaurant and menu
      responses:
        "200":
          content:
            application/json:
              example:
                prepTime:
                  pickupMinutes: 35
                  deliveryMinutes: 60
                  rushDelayMinutes: 15
                  basePickupMinutes: 20
                  baseDeliveryMinutes: 45
  /api/v1/orders:
    post:
      operationId: createOrder
      tags:
        - Orders
      requestBody:
        content:
          application/json:
            example:
              items:
                - productId: cm1pza0001margherita
                  variantId: cm1pza0002medium
                  addonIds:
                    - cm1pza0003extracheese
                  quantity: 2
                  notes: Godt stekt
              fulfillment: PICKUP
              customerName: Kari Nordmann
              customerEmail: kari@example.com
              customerPhone: "+4799999999"
              paymentMethod: STRIPE
              expectedTotal: 33800
              locale: nb
      responses:
        "200":
          content:
            application/json:
              example:
                orderId: cm2ord0001abcdefghijklmn
                publicToken: cm2tok0001abcdefghijklmn
                totals:
                  subtotal: 33800
                  deliveryFee: 0
                  discount: 0
                  total: 33800
                  currency: NOK
                stripeUrl: https://pay.example.com/checkout/abc123
        "400":
          description: >-
            `MISSING_SLUG`, `INVALID_JSON`, `INVALID_SUCCESS_URL`, `INVALID_CANCEL_URL`, or `BAD_REQUEST`: an
            invalid `Idempotency-Key`, the restaurant is closed at the requested time, or it does not offer
            the chosen fulfillment or payment method.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`RESTAURANT_NOT_FOUND`: no live restaurant has this slug."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "`PAYMENT_PROVIDER_INVALID`: the payment provider returned an unusable payment link."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            `INTERNAL_ERROR`: the payment provider did not respond. The order was saved without a payment
            link. Start again with a new `Idempotency-Key`, or offer cash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/orders/{token}:
    get:
      operationId: getOrder
      tags:
        - Orders
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  order:
                    x-fern-type-name: Order
                    properties:
                      restaurant:
                        x-fern-type-name: OrderRestaurant
        "400":
          description: "`MISSING_TOKEN`: the token is not in a valid format."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "`RATE_LIMITED`: too many requests from this IP or for this token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/address-search:
    get:
      operationId: searchAddresses
      tags:
        - Orders
      responses:
        "200":
          content:
            application/json:
              example:
                hits:
                  - label: Storgata 1, 3126 Tønsberg
                    street: Storgata 1
                    postalCode: "3126"
                    city: Tønsberg
                    lat: 59.2676
                    lng: 10.4076
        "404":
          description: "`RESTAURANT_NOT_FOUND`: no live restaurant has this slug."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "`INTERNAL_ERROR`: the address lookup failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/dine-in/availability:
    get:
      operationId: getReservationAvailability
      tags:
        - Reservations
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  slots:
                    items:
                      x-fern-type-name: ReservationSlot
              example:
                enabled: true
                maxPartySize: 8
                slots:
                  - time: "17:00"
                    iso: "2026-10-16T15:00:00.000Z"
                    available: true
                  - time: "17:15"
                    iso: "2026-10-16T15:15:00.000Z"
                    available: false
  /api/v1/reservations:
    post:
      operationId: createReservation
      tags:
        - Reservations
      requestBody:
        content:
          application/json:
            example:
              dineInAt: "2026-10-16T15:00:00.000Z"
              partySize: 4
              guestName: Kari Nordmann
              guestEmail: kari@example.com
              guestPhone: "+4799999999"
              note: Én barnestol, takk
              locale: nb
      responses:
        "201":
          content:
            application/json:
              example:
                reservationId: cm2res0001abcdefghijklmn
                publicToken: cm2tok0002abcdefghijklmn
                orderNumber: 1043
                status: PENDING_APPROVAL
                dineInAt: "2026-10-16T15:00:00.000Z"
                partySize: 4
                tableId: null
        "400":
          description: "`MISSING_SLUG`, `INVALID_JSON`, or `BAD_REQUEST` for an invalid `Idempotency-Key`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`RESTAURANT_NOT_FOUND`: no live restaurant has this slug."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/coupons/validate:
    post:
      operationId: validateCoupon
      tags:
        - Coupons and newsletter
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cart:
                  items:
                    x-fern-type-name: CouponCartLine
            example:
              slug: pizzaroma
              code: VELKOMMEN
              subtotal: 33800
              fulfillment: PICKUP
              cart:
                - productId: cm1pza0001margherita
                  categoryId: cm1cat0001pizza
                  quantity: 2
                  variantName: Medium
                  lineTotal: 33800
              email: kari@example.com
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - x-fern-type-name: CouponValid
                    properties:
                      coupon:
                        x-fern-type-name: ValidatedCoupon
                  - x-fern-type-name: CouponNotValid
              example:
                valid: true
                discount: 5000
                coupon:
                  code: VELKOMMEN
                  description: 50 kr off your first order
                  displayName: Velkomstrabatt
                  discountType: FIXED
                  discountValue: 5000
                  minimumOrder: 20000
                  appliesTo: ORDER
                  bundleQuantity: null
                  bundleTierKey: null
                  maxBundlesPerOrder: null
        "404":
          description: "`RESTAURANT_NOT_FOUND`: no live restaurant has this slug."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`VALIDATION_FAILED`: the body failed validation. `error.details.issues` lists the fields."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "`RATE_LIMITED`: more than 30 requests in 60 seconds for this slug and IP."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/coupons/preview-auto:
    post:
      operationId: previewAutomaticPromotion
      tags:
        - Coupons and newsletter
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cart:
                  items:
                    x-fern-type-name: PromotionCartLine
            example:
              slug: pizzaroma
              subtotal: 36800
              fulfillment: PICKUP
              deliveryFee: 0
              cart:
                - productId: cm1pza0001margherita
                  quantity: 2
                  variantName: Stor
                  lineTotal: 36800
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - x-fern-type-name: PromotionApplies
                    properties:
                      coupon:
                        x-fern-type-name: PreviewedPromotion
              example:
                applies: true
                discount: 6900
                coupon:
                  code: AUTO-2STORE
                  description: 2 large pizzas for 299 kr
                  displayName: 2 store for 299
                  discountType: BUNDLE
                  discountValue: 29900
                  appliesTo: CATEGORIES
                  bundleQuantity: 2
                  bundleTierKey: stor
                  maxBundlesPerOrder: null
  /api/v1/newsletter/signup:
    post:
      operationId: signUpForNewsletter
      tags:
        - Coupons and newsletter
      requestBody:
        content:
          application/json:
            example:
              email: kari@example.com
              name: Kari
      responses:
        "200":
          content:
            application/json:
              example:
                couponCode: VELKOMMEN
                discountType: PERCENT
                discountValue: 10
                successMessage: Takk! Bruk koden {{code}} for {{discount}} rabatt.
        "400":
          description: "`MISSING_SLUG` or `INVALID_JSON`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/site-gate:
    get:
      operationId: getSiteGate
      tags:
        - Website
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  gate:
                    x-fern-type-name: SiteGate
              example:
                gate:
                  enabled: true
                  password: forhandsvisning-2026
  /api/v1/partner/restaurants:
    get:
      operationId: listPartnerRestaurants
      tags:
        - Partner
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  - slug: pizzaroma-test
                    name: Pizza Roma (test)
                    environment: TEST
                    sandbox: true
                    live: false
                    archived: false
                    createdAt: "2026-10-16T08:12:00.000Z"
                nextCursor: null
    post:
      operationId: createPartnerRestaurant
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              name: Pizza Roma (test)
              slug: pizzaroma-test
              email: dev@byraet.no
              pickupEnabled: true
              deliveryEnabled: false
      responses:
        "201":
          content:
            application/json:
              example:
                data:
                  slug: pizzaroma-test
                  name: Pizza Roma (test)
                  environment: TEST
                  sandbox: true
                  live: false
                  archived: false
                  createdAt: "2026-10-16T08:12:00.000Z"
                restaurantKey:
                  id: cm2key0001abcdefghijklmn
                  name: Opprettet via partner-API
                  last4: x9Qa
                  environment: TEST
                  scopes:
                    - "*"
                  key: lbs_test_cm2key0001abcdefghijklmn_q8Vt2mWkRb7LpZ3nDc5HsYf1JuE9aT0oGi4Nw6Kx9Qa
                message: Lagre restaurantnøkkelen nå. Den vises ikke igjen.
  /api/v1/partner/restaurants/{slug}:
    get:
      operationId: getPartnerRestaurant
      tags:
        - Partner
    delete:
      operationId: deletePartnerRestaurant
      tags:
        - Partner
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  result: deleted
                  slug: pizzaroma-test
  /api/v1/partner/restaurants/{slug}/keys/{keyId}:
    delete:
      operationId: revokeRestaurantKey
      tags:
        - Partner
  /api/v1/partner/restaurants/{slug}/keys/{keyId}/rotate:
    post:
      operationId: rotateRestaurantKey
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              name: Website (October 2026)
              graceHours: 24
  /api/v1/partner/restaurants/{slug}/webhooks:
    get:
      operationId: listRestaurantWebhooks
      tags:
        - Partner
    post:
      operationId: createRestaurantWebhook
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              url: https://hooks.byraet.no/lettbestilt
              events:
                - ORDER_PAID
                - ORDER_STATUS_CHANGED
  /api/v1/partner/restaurants/{slug}/webhooks/{webhookId}:
    delete:
      operationId: deleteRestaurantWebhook
      tags:
        - Partner
  /api/v1/partner/restaurants/{slug}/owner-invite:
    post:
      operationId: inviteRestaurantOwner
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              name: Kari Nordmann
              email: kari@pizzaroma.no
    delete:
      operationId: revokeRestaurantOwnerInvite
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              inviteId: inv_01j9x2
  /api/v1/partner/restaurants/{slug}/go-live-review:
    post:
      operationId: requestGoLiveReview
      tags:
        - Partner
    delete:
      operationId: withdrawGoLiveReview
      tags:
        - Partner
  /api/v1/partner/restaurants/{slug}/domains:
    get:
      operationId: listRestaurantDomains
      tags:
        - Partner
    post:
      operationId: addRestaurantDomain
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              domain: www.pizzaroma.no
  /api/v1/partner/restaurants/{slug}/domains/{domainId}:
    delete:
      operationId: deleteRestaurantDomain
      tags:
        - Partner
    patch:
      operationId: setRestaurantPrimaryDomain
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              primary: true
  /api/v1/partner/restaurants/{slug}/domains/{domainId}/verify:
    post:
      operationId: verifyRestaurantDomain
      tags:
        - Partner
  /api/v1/partner/restaurants/{slug}/menu-imports:
    post:
      operationId: createMenuImport
      tags:
        - Partner
  /api/v1/partner/restaurants/{slug}/menu-imports/{importId}:
    get:
      operationId: getMenuImport
      tags:
        - Partner
  /api/v1/partner/restaurants/{slug}/menu-imports/{importId}/commit:
    post:
      operationId: commitMenuImport
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              menuName: Hovedmeny
  /api/v1/partner/restaurants/{slug}/settings:
    get:
      operationId: getPartnerRestaurantSettings
      tags:
        - Partner
    patch:
      operationId: updatePartnerRestaurantSettings
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              expectedVersion: 3f9a1c0d7be24e51
              name: Pizza Roma
              primaryColor: "#B3261E"
              pickupEnabled: true
              deliveryEnabled: true
  /api/v1/partner/restaurants/{slug}/hours:
    get:
      operationId: getPartnerRestaurantHours
      tags:
        - Partner
    put:
      operationId: setPartnerRestaurantHours
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              days:
                - dayOfWeek: MONDAY
                  opensAt: "15:00"
                  closesAt: "22:00"
                  isClosed: false
                - dayOfWeek: SATURDAY
                  opensAt: "13:00"
                  closesAt: "23:00"
                  isClosed: false
  /api/v1/partner/restaurants/{slug}/hours/overrides:
    post:
      operationId: createPartnerHoursOverride
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              label: Julaften
              startDate: "2026-12-24"
              endDate: "2026-12-24"
              isClosed: true
  /api/v1/partner/restaurants/{slug}/hours/overrides/{overrideId}:
    patch:
      operationId: updatePartnerHoursOverride
      tags:
        - Partner
    delete:
      operationId: deletePartnerHoursOverride
      tags:
        - Partner
  /api/v1/partner/restaurants/{slug}/delivery-zones:
    get:
      operationId: listPartnerDeliveryZones
      tags:
        - Partner
    post:
      operationId: createPartnerDeliveryZone
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              name: Sentrum
              type: POSTAL_CODES
              postalCodes:
                - "3110"
                - "3111"
              deliveryFee: 4900
              minimumOrder: 20000
              estimatedMinutes: 40
  /api/v1/partner/restaurants/{slug}/delivery-zones/{zoneId}:
    patch:
      operationId: updatePartnerDeliveryZone
      tags:
        - Partner
    delete:
      operationId: deletePartnerDeliveryZone
      tags:
        - Partner
  /api/v1/partner/restaurants/{slug}/menus:
    get:
      operationId: listPartnerMenus
      tags:
        - Partner
    post:
      operationId: createPartnerMenu
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              name: Hovedmeny
              proposal:
                version: 1
                categories:
                  - name: Pizza
                    products:
                      - name: Margherita
                        price: 16900
                        allergens:
                          - WHEAT
                          - MILK
  /api/v1/partner/restaurants/{slug}/menus/{menuId}:
    get:
      operationId: getPartnerMenu
      tags:
        - Partner
    patch:
      operationId: updatePartnerMenu
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              isActive: true
              isDefault: true
