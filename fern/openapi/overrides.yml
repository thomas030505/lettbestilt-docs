  /api/v1/partner/restaurants/{slug}/products/batch:
    post:
      operationId: createPartnerProductsBatch
      tags:
        - Partner
  /api/v1/partner/restaurants/{slug}/products/{productId}:
    patch:
      operationId: updatePartnerProduct
      tags:
        - Partner
    delete:
      operationId: deletePartnerProduct
      tags:
        - Partner
  /api/v1/partner/restaurants/{slug}/addon-groups:
    get:
      operationId: listPartnerAddonGroups
      tags:
        - Partner
    post:
      operationId: createPartnerAddonGroup
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              name: Ekstra
              scope: PRODUCT
              productIds:
                - prod_123
              maxSelect: 3
              addons:
                - name: Ost
                  price: 1500
  /api/v1/partner/restaurants/{slug}/addon-groups/{groupId}:
    patch:
      operationId: updatePartnerAddonGroup
      tags:
        - Partner
    delete:
      operationId: deletePartnerAddonGroup
      tags:
        - Partner
  /api/v1/partner/me:
    get:
      operationId: getPartnerAccount
      tags:
        - Partner
  /api/v1/partner/brand:
    get:
      operationId: getPartnerBrand
      tags:
        - Partner
    patch:
      operationId: updatePartnerBrand
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              expectedUpdatedAt: "2026-10-20T10:00:00.000Z"
              supportEmail: support@yourcompany.no
              themeSidebarColor: "#1f2a44"
              themeFont: figtree
  /api/v1/partner/brand/logo:
    post:
      operationId: uploadPartnerLogo
      tags:
        - Partner
  /api/v1/partner/brand/logo-light:
    post:
      operationId: uploadPartnerLightLogo
      tags:
        - Partner
  /api/v1/partner/brand/sender-domain:
    get:
      operationId: getPartnerSenderDomain
      tags:
        - Partner
    post:
      operationId: setPartnerSenderDomain
      tags:
        - Partner
    delete:
      operationId: deletePartnerSenderDomain
      tags:
        - Partner
  /api/v1/partner/brand/sender-domain/verify:
    post:
      operationId: verifyPartnerSenderDomain
      tags:
        - Partner
  /api/v1/partner/profile:
    get:
      operationId: getPartnerProfile
      tags:
        - Partner
    patch:
      operationId: updatePartnerProfile
      tags:
        - Partner
  /api/v1/partner/news:
    get:
      operationId: listPartnerNews
      tags:
        - Partner
    post:
      operationId: createPartnerNews
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              title: New opening hours in the dashboard
              body: You can now set holiday hours under **Åpningstider**.
              level: UPDATE
              audienceAll: false
              restaurantSlugs:
                - pizza-roma
  /api/v1/partner/news/{newsId}:
    get:
      operationId: getPartnerNews
      tags:
        - Partner
    patch:
      operationId: updatePartnerNews
      tags:
        - Partner
    delete:
      operationId: deletePartnerNews
      tags:
        - Partner
  /api/v1/partner/news/{newsId}/publish:
    post:
      operationId: publishPartnerNews
      tags:
        - Partner
      requestBody:
        content:
          application/json:
            example:
              action: schedule
              scheduledAt: "2026-11-01T09:00:00+01:00"
webhooks:
  orderCreated:
    post:
      operationId: orderCreated
      tags:
        - Webhooks
      summary: Order created
      description: >-
        Sent when a new takeaway order is created. Online orders are sent while they still wait for payment
        (`status: "AWAITING_PAYMENT"`); `ORDER_PAID` follows when the payment is confirmed. If the customer
        never pays, no further event is sent. Cash orders arrive as `CONFIRMED`. An online order is sent once
        SagaPay has created the payment page; if SagaPay cannot, the order fails, the API answers `503`, and
        no event is sent.


        `estimatedReadyAt` is the kitchen's estimate including rush, and `requestedPickupAt` is the agreed
        time for a pre-order. They are the same times the tracking page shows.
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookDeliveryIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - createdAt
                - data
              properties:
                event:
                  type: string
                  enum:
                    - ORDER_CREATED
                createdAt:
                  type: string
                  format: date-time
                  description: When the event happened (ISO 8601, UTC). Use it to order events.
                data:
                  $ref: "#/components/schemas/OrderCreatedData"
            example:
              event: ORDER_CREATED
              createdAt: "2026-10-16T15:02:11.000Z"
              data:
                orderId: cm2ord0001abcdefghijklmn
                orderNumber: 1042
                publicToken: cm2tok0001abcdefghijklmn
                status: AWAITING_PAYMENT
                total: 33800
                fulfillment: PICKUP
                paymentMethod: STRIPE
                estimatedReadyAt: "2026-10-16T15:37:11.000Z"
                requestedPickupAt: null
                attributedCampaignId: null
      responses:
        "200":
          description: Respond with any `2xx` status within 5 seconds to acknowledge the event.
  orderPaid:
    post:
      operationId: orderPaid
      tags:
        - Webhooks
      summary: Order paid
      description: >-
        Sent once when the online payment for an order is confirmed. This is when an online order reaches the
        kitchen.
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookDeliveryIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - createdAt
                - data
              properties:
                event:
                  type: string
                  enum:
                    - ORDER_PAID
                createdAt:
                  type: string
                  format: date-time
                  description: When the event happened (ISO 8601, UTC).
                data:
                  $ref: "#/components/schemas/OrderPaidData"
            example:
              event: ORDER_PAID
              createdAt: "2026-10-16T15:03:40.000Z"
              data:
                orderId: cm2ord0001abcdefghijklmn
                orderNumber: 1042
                publicToken: cm2tok0001abcdefghijklmn
                status: PAID
                total: 33800
                attributedCampaignId: null
      responses:
        "200":
          description: Respond with any `2xx` status within 5 seconds to acknowledge the event.
  orderStatusChanged:
    post:
      operationId: orderStatusChanged
      tags:
        - Webhooks
      summary: Order status changed
      description: >-
        Sent when the restaurant moves an order to a new status, for example to `PREPARING` or
        `READY_FOR_PICKUP`. Cancellations are sent as `ORDER_CANCELLED` instead, and payment as `ORDER_PAID`.
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookDeliveryIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - createdAt
                - data
              properties:
                event:
                  type: string
                  enum:
                    - ORDER_STATUS_CHANGED
                createdAt:
                  type: string
                  format: date-time
                  description: When the event happened (ISO 8601, UTC).
                data:
                  $ref: "#/components/schemas/OrderStatusChangeData"
            example:
              event: ORDER_STATUS_CHANGED
              createdAt: "2026-10-16T15:20:05.000Z"
              data:
                orderId: cm2ord0001abcdefghijklmn
                orderNumber: 1042
                publicToken: cm2tok0001abcdefghijklmn
                previousStatus: PREPARING
                status: READY_FOR_PICKUP
      responses:
        "200":
          description: Respond with any `2xx` status within 5 seconds to acknowledge the event.
  orderCancelled:
    post:
      operationId: orderCancelled
      tags:
        - Webhooks
      summary: Order cancelled
      description: >-
        Sent when the restaurant cancels an order. `status` is always `CANCELLED`; `previousStatus` is the
        status before.
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookDeliveryIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - createdAt
                - data
              properties:
                event:
                  type: string
                  enum:
                    - ORDER_CANCELLED
                createdAt:
                  type: string
                  format: date-time
                  description: When the event happened (ISO 8601, UTC).
                data:
                  $ref: "#/components/schemas/OrderStatusChangeData"
            example:
              event: ORDER_CANCELLED
              createdAt: "2026-10-16T15:05:00.000Z"
              data:
                orderId: cm2ord0001abcdefghijklmn
                orderNumber: 1042
                publicToken: cm2tok0001abcdefghijklmn
                previousStatus: CONFIRMED
                status: CANCELLED
      responses:
        "200":
          description: Respond with any `2xx` status within 5 seconds to acknowledge the event.
  reservationRequested:
    post:
      operationId: reservationRequested
      tags:
        - Webhooks
      summary: Reservation requested
      description: Sent when a guest requests a table through `POST /reservations`.
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookDeliveryIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - createdAt
                - data
              properties:
                event:
                  type: string
                  enum:
                    - RESERVATION_REQUESTED
                createdAt:
                  type: string
                  format: date-time
                  description: When the event happened (ISO 8601, UTC).
                data:
                  $ref: "#/components/schemas/ReservationRequestedData"
            example:
              event: RESERVATION_REQUESTED
              createdAt: "2026-10-14T09:12:00.000Z"
              data:
                orderId: cm2res0001abcdefghijklmn
                orderNumber: 1043
                publicToken: cm2tok0002abcdefghijklmn
                dineInAt: "2026-10-16T15:00:00.000Z"
                partySize: 4
      responses:
        "200":
          description: Respond with any `2xx` status within 5 seconds to acknowledge the event.
  reservationApproved:
    post:
      operationId: reservationApproved
      tags:
        - Webhooks
      summary: Reservation approved
      description: >-
        Sent when the restaurant approves a reservation request and assigns a table. The reservation's status
        becomes `CONFIRMED`.
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookDeliveryIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - createdAt
                - data
              properties:
                event:
                  type: string
                  enum:
                    - RESERVATION_APPROVED
                createdAt:
                  type: string
                  format: date-time
                  description: When the event happened (ISO 8601, UTC).
                data:
                  $ref: "#/components/schemas/ReservationApprovedData"
            example:
              event: RESERVATION_APPROVED
              createdAt: "2026-10-14T10:30:00.000Z"
              data:
                orderId: cm2res0001abcdefghijklmn
                orderNumber: 1043
                publicToken: cm2tok0002abcdefghijklmn
                dineInAt: "2026-10-16T15:00:00.000Z"
                partySize: 4
                tableId: cm1tbl0001abcdefghijklmn
      responses:
        "200":
          description: Respond with any `2xx` status within 5 seconds to acknowledge the event.
  reservationRejected:
    post:
      operationId: reservationRejected
      tags:
        - Webhooks
      summary: Reservation rejected
      description: Sent when the restaurant rejects a reservation request. The reservation's status becomes `CANCELLED`.
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookDeliveryIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - createdAt
                - data
              properties:
                event:
                  type: string
                  enum:
                    - RESERVATION_REJECTED
                createdAt:
                  type: string
                  format: date-time
                  description: When the event happened (ISO 8601, UTC).
                data:
                  $ref: "#/components/schemas/ReservationRejectedData"
            example:
              event: RESERVATION_REJECTED
              createdAt: "2026-10-14T10:31:00.000Z"
              data:
                orderId: cm2res0001abcdefghijklmn
                orderNumber: 1043
                publicToken: cm2tok0002abcdefghijklmn
                reason: Fullt den kvelden
      responses:
        "200":
          description: Respond with any `2xx` status within 5 seconds to acknowledge the event.
  paymentSetupUpdated:
    post:
      operationId: paymentSetupUpdated
      tags:
        - Webhooks
      summary: Payment setup updated
      description: >-
        Sent when the state of the restaurant's online payment setup (SagaPay) changes, for example from
        `WAITING_FOR_OWNER` to `IN_PROGRESS` when the owner has signed, or to `ACTIVE` when online payment
        works. `payment` has the same form as `payment` in `GET /api/v1/partner/restaurants/{slug}`. Use
        `WAITING_FOR_OWNER` to remind the owner: only the owner can finish the registration with BankID.
        Never sent for sandboxes, and never for internal SagaPay steps that keep the same state.
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookDeliveryIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - createdAt
                - data
              properties:
                event:
                  type: string
                  enum:
                    - PAYMENT_SETUP_UPDATED
                createdAt:
                  type: string
                  format: date-time
                  description: When the event happened (ISO 8601, UTC).
                data:
                  $ref: "#/components/schemas/PaymentSetupUpdatedData"
            example:
              event: PAYMENT_SETUP_UPDATED
              createdAt: "2026-10-20T10:31:00.000Z"
              data:
                restaurantSlug: pizzeria-napoli
                payment:
                  state: WAITING_FOR_OWNER
                  label: Venter på eieren
                  description: Venter på at eieren fullfører registreringen hos SagaPay med BankID. Det kan bare eieren gjøre.
                previousState: NOT_STARTED
      responses:
        "200":
          description: Respond with any `2xx` status within 5 seconds to acknowledge the event.
  ping:
    post:
      operationId: ping
      tags:
        - Webhooks
      summary: Test event (PING)
      description: >-
        Sent only when someone chooses **Send test event** for the webhook in LettBestilt Partner, to check
        that your endpoint receives and verifies deliveries. It is signed like every other event, is sent even
        when the webhook is paused, and is never retried. You cannot subscribe to it. Answer `2xx` and ignore
        it, or log it.
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookDeliveryIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - createdAt
                - data
              properties:
                event:
                  type: string
                  enum:
                    - PING
                createdAt:
                  type: string
                  format: date-time
                  description: When the test event was sent (ISO 8601, UTC).
                data:
                  type: object
                  required:
                    - webhookId
                    - restaurantSlug
                    - test
                    - message
                  properties:
                    webhookId:
                      type: string
                      description: The webhook subscription the test was sent to.
                    restaurantSlug:
                      type: string
                    test:
                      type: boolean
                      enum:
                        - true
                    message:
                      type: string
                      description: A fixed Norwegian text.
            example:
              event: PING
              createdAt: "2026-10-16T09:00:00.000Z"
              data:
                webhookId: cm2whk0001abcdefghijklmn
                restaurantSlug: pizzaroma-test
                test: true
                message: Testhendelse fra LettBestilt
      responses:
        "200":
          description: Respond with any `2xx` status within 5 seconds.
components:
  parameters:
    WebhookIdHeader:
      name: X-LettBestilt-Webhook-Id
      in: header
      required: true
      description: The ID of the webhook subscription this delivery belongs to.
      schema:
        type: string
    WebhookDeliveryIdHeader:
      name: X-LettBestilt-Delivery-Id
      in: header
      required: true
      description: >-
        Stable per event and subscription. Retries of the same event, and deliveries sent again with
        **Resend** in LettBestilt Partner, carry the same ID, so use it to skip events you have already
        handled.
      schema:
        type: string
    WebhookTimestampHeader:
      name: X-LettBestilt-Webhook-Timestamp
      in: header
      required: true
      description: Unix time in seconds when this attempt was signed. Reject old timestamps to stop replays.
      schema:
        type: string
    WebhookSignatureHeader:
      name: X-LettBestilt-Webhook-Signature
      in: header
      required: true
      description: >-
        `sha256=` followed by the hex HMAC-SHA256 of `{timestamp}.{raw body}`, keyed with the webhook's
        signing secret (`whsec_…`).
      schema:
        type: string
  schemas:
    OrderStatus:
      type: string
      description: The status of an order or reservation.
      enum:
        - PENDING
        - PENDING_APPROVAL
        - AWAITING_PAYMENT
        - PAID
        - CONFIRMED
        - PREPARING
        - READY_FOR_PICKUP
        - OUT_FOR_DELIVERY
        - COMPLETED
        - CANCELLED
        - FAILED
      x-fern-enum:
        PENDING:
          description: Waiting. Not set on orders created through this API.
        PENDING_APPROVAL:
          description: A reservation request waiting for the restaurant.
        AWAITING_PAYMENT:
          description: An online order waiting for payment. Not shown to the kitchen yet.
        PAID:
          description: Online payment confirmed.
        CONFIRMED:
          description: Accepted by the restaurant. Cash orders start here; approved reservations end up here.
        PREPARING:
          description: The kitchen is making the order.
        READY_FOR_PICKUP:
          description: Ready to be picked up.
        OUT_FOR_DELIVERY:
          description: On its way to the customer.
        COMPLETED:
          description: Picked up or delivered.
        CANCELLED:
          description: Cancelled by the restaurant, or a rejected reservation request.
        FAILED:
          description: The online payment failed.
    OrderCreatedData:
      type: object
      description: The `data` of an `ORDER_CREATED` event.
      required:
        - orderId
        - orderNumber
        - publicToken
        - status
        - total
        - fulfillment
        - paymentMethod
        - estimatedReadyAt
        - requestedPickupAt
      properties:
        orderId:
          type: string
          description: The order's ID, the same as `orderId` from `POST /orders`.
        orderNumber:
          type: integer
          description: The number the restaurant and the customer see.
        publicToken:
          type: string
          description: Use it with `GET /orders/{token}`.
        status:
          $ref: "#/components/schemas/OrderStatus"
        total:
          type: integer
          description: The total in øre.
        fulfillment:
          type: string
          enum:
            - PICKUP
            - DELIVERY
        paymentMethod:
          type: string
          enum:
            - STRIPE
            - CASH
            - VIPPS
          description: The `paymentMethod` the order was created with. `STRIPE` means online payment through SagaPay.
        estimatedReadyAt:
          type:
            - string
            - "null"
          format: date-time
          description: The kitchen's estimate including rush (ISO 8601, UTC).
        requestedPickupAt:
          type:
            - string
            - "null"
          format: date-time
          description: The agreed time for a pre-order, otherwise `null`.
        attributedCampaignId:
          type:
            - string
            - "null"
          description: >-
            The newsletter campaign the order was credited to, or `null`. See [Campaign
            tracking](/campaign-tracking).
    OrderPaidData:
      type: object
      description: The `data` of an `ORDER_PAID` event.
      required:
        - orderId
        - orderNumber
        - publicToken
        - status
        - total
      properties:
        orderId:
          type: string
        orderNumber:
          type: integer
        publicToken:
          type: string
        status:
          type: string
          enum:
            - PAID
        total:
          type: integer
          description: The amount paid, in øre.
        attributedCampaignId:
          type:
            - string
            - "null"
          description: >-
            The newsletter campaign the order was credited to, or `null`. See [Campaign
            tracking](/campaign-tracking).
    ReservationRequestedData:
      type: object
      description: The `data` of a `RESERVATION_REQUESTED` event.
      required:
        - orderId
        - orderNumber
        - publicToken
        - dineInAt
        - partySize
      properties:
        orderId:
          type: string
          description: The reservation's ID, the same as `reservationId` from `POST /reservations`.
        orderNumber:
          type: integer
        publicToken:
          type: string
        dineInAt:
          type: string
          format: date-time
          description: The requested time (ISO 8601, UTC).
        partySize:
          type: integer
    ReservationApprovedData:
      type: object
      description: The `data` of a `RESERVATION_APPROVED` event.
      required:
        - orderId
        - orderNumber
        - publicToken
        - dineInAt
        - partySize
        - tableId
      properties:
        orderId:
          type: string
        orderNumber:
          type: integer
        publicToken:
          type: string
        dineInAt:
          type: string
          format: date-time
          description: The reserved time (ISO 8601, UTC).
        partySize:
          type: integer
        tableId:
          type: string
          description: The assigned table.
    ReservationRejectedData:
      type: object
      description: The `data` of a `RESERVATION_REJECTED` event.
      required:
        - orderId
        - orderNumber
        - publicToken
        - reason
      properties:
        orderId:
          type: string
        orderNumber:
          type: integer
        publicToken:
          type: string
        reason:
          type:
            - string
            - "null"
          description: The reason the restaurant gave, or `null`.
    PaymentSetupUpdatedData:
      type: object
      description: The `data` of a `PAYMENT_SETUP_UPDATED` event. No personal data.
      required:
        - restaurantSlug
        - payment
        - previousState
      properties:
        restaurantSlug:
          type: string
        payment:
          type: object
          required:
            - state
            - label
            - description
          properties:
            state:
              type: string
              enum:
                - NOT_STARTED
                - WAITING_FOR_OWNER
                - IN_PROGRESS
                - ACTIVE
                - FAILED
            label:
              type: string
              description: Short Norwegian label, for example «Venter på eieren».
            description:
              type: string
              description: One Norwegian sentence on what happens and who acts next.
        previousState:
          type: string
          enum:
            - NOT_STARTED
            - WAITING_FOR_OWNER
            - IN_PROGRESS
            - ACTIVE
            - FAILED
    OrderStatusChangeData:
      type: object
      description: The `data` of an `ORDER_STATUS_CHANGED` or `ORDER_CANCELLED` event.
      required:
        - orderId
        - orderNumber
        - publicToken
        - previousStatus
        - status
      properties:
        orderId:
          type: string
        orderNumber:
          type: integer
        publicToken:
          type: string
        previousStatus:
          $ref: "#/components/schemas/OrderStatus"
        status:
          $ref: "#/components/schemas/OrderStatus"
    CreateOrderResponse:
      properties:
        totals:
          x-fern-type-name: OrderTotals
    Error:
      properties:
        error:
          x-fern-type-name: ErrorBody
