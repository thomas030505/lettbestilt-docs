              description: Steinovnsbakt
  /api/v1/partner/restaurants/{slug}/categories/{categoryId}:
    patch:
      operationId: updatePartnerCategory
      tags:
        - Partner
    delete:
      operationId: deletePartnerCategory
      tags:
        - Partner
  /api/v1/partner/restaurants/{slug}/categories/{categoryId}/products:
    post:
      operationId: createPartnerProduct
      tags:
        - Partner
