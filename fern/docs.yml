instances:
  - url: lettbestilt.docs.buildwithfern.com
    custom-domain: docs.lettbestilt.no

title: LettBestilt API

logo:
  light: ./assets/logo-light.png
  dark: ./assets/logo-dark.png
  height: 28
  href: https://www.lettbestilt.no

favicon: ./assets/favicon.svg

colors:
  # LettBestilts mørkeblå (DESIGN.md --lb-action) for lenker, aktiv fane og knapper.
  accent-primary:
    light: "#1f3a4a"
    dark: "#9cc3d5"
  # Hvit flate som SagaPays docs, i stedet for Ferns grå standard.
  background:
    light: "#ffffff"
    dark: "#0d1418"
  header-background:
    light: "#ffffff"
    dark: "#0d1418"
  sidebar-background:
    light: "#ffffff"
    dark: "#0d1418"
  card-background:
    light: "#f6f8fa"
    dark: "#141d22"
  border:
    light: "#e5e8ec"
    dark: "#1f2a30"

layout:
  searchbar-placement: header
  tabs-placement: header

navbar-links:
  - type: minimal
    text: lettbestilt.no
    url: https://www.lettbestilt.no
  - type: filled
    text: Become a partner
    url: https://www.lettbestilt.no/bli-partner

tabs:
  guides:
    display-name: Guides
    icon: book-open
    skip-slug: true
  api:
    display-name: API reference
    icon: code
    skip-slug: true

navigation:
  - tab: guides
    layout:
      - section: Get started
        skip-slug: true
        contents:
          - page: Introduction
            slug: introduction
            path: ./pages/introduction.mdx
          - page: Quickstart
            slug: quickstart
            path: ./pages/quickstart.mdx
          - page: Authentication
            slug: authentication
            path: ./pages/authentication.mdx
          - page: Core concepts
            slug: concepts
            path: ./pages/concepts.mdx
      - section: Build
        skip-slug: true
        contents:
          - page: Build an ordering flow
            slug: build-an-ordering-flow
            path: ./pages/ordering-flow.mdx
          - page: Payments
            slug: payments
            path: ./pages/payments.mdx
          - page: Coupons and promotions
            slug: coupons
            path: ./pages/coupons.mdx
          - page: Table reservations
            slug: reservations
            path: ./pages/reservations.mdx
          - page: Webhooks
            slug: webhooks
            path: ./pages/webhooks.mdx
          - page: Campaign tracking
            slug: campaign-tracking
            path: ./pages/campaign-tracking.mdx
      - section: Partners
        skip-slug: true
        contents:
          - page: LettBestilt Partner API
            slug: partner-api
            path: ./pages/partner-api.mdx
          - page: Set up a restaurant through the API
            slug: partner-setup-api
            path: ./pages/partner-setup-api.mdx
          - page: From sandbox to live
            slug: sandbox-to-live
            path: ./pages/sandbox-to-live.mdx
          - page: LettBestilt MCP
            slug: mcp
            path: ./pages/mcp.mdx
          - page: Rotating keys without downtime
            slug: rotating-keys
            path: ./pages/rotating-keys.mdx
          - page: Debugging with request IDs
            slug: debugging
            path: ./pages/debugging.mdx
      - section: Go live
        skip-slug: true
        contents:
          - page: Errors, rate limits and retries
            slug: errors
            path: ./pages/errors.mdx
          - page: Go-live checklist
            slug: go-live
            path: ./pages/go-live.mdx
          - page: Changelog
            slug: changelog
            path: ./pages/changelog.mdx
  - tab: api
    layout:
      - api: API reference
        layout:
          - section: Restaurant and menu
            referenced-packages:
              - restaurantAndMenu
            contents:
              - GET /api/v1/restaurant
              - GET /api/v1/menu
              - GET /api/v1/prep-time
          - section: Orders
            referenced-packages:
              - orders
            contents:
              - POST /api/v1/orders
              - GET /api/v1/orders/{token}
              - GET /api/v1/address-search
          - section: Reservations
            referenced-packages:
              - reservations
            contents:
              - GET /api/v1/dine-in/availability
              - POST /api/v1/reservations
          - section: Coupons and newsletter
            referenced-packages:
              - couponsAndNewsletter
            contents:
              - POST /api/v1/coupons/validate
              - POST /api/v1/coupons/preview-auto
              - POST /api/v1/newsletter/signup
          - section: Website
            referenced-packages:
              - website
            contents:
              - GET /api/v1/site-gate
          - section: Partner
            referenced-packages:
              - partner
            contents:
              - section: Restaurants
                skip-slug: true
                contents:
                  - GET /api/v1/partner/restaurants
                  - POST /api/v1/partner/restaurants
                  - GET /api/v1/partner/restaurants/{slug}
                  - DELETE /api/v1/partner/restaurants/{slug}
              - section: Restaurant keys
                skip-slug: true
                contents:
                  - POST /api/v1/partner/restaurants/{slug}/keys/{keyId}/rotate
                  - DELETE /api/v1/partner/restaurants/{slug}/keys/{keyId}
              - section: Owner and go-live
                skip-slug: true
                contents:
                  - POST /api/v1/partner/restaurants/{slug}/owner-invite
                  - DELETE /api/v1/partner/restaurants/{slug}/owner-invite
                  - POST /api/v1/partner/restaurants/{slug}/go-live-review
                  - DELETE /api/v1/partner/restaurants/{slug}/go-live-review
              - section: Domains
                skip-slug: true
                contents:
                  - GET /api/v1/partner/restaurants/{slug}/domains
                  - POST /api/v1/partner/restaurants/{slug}/domains
                  - POST /api/v1/partner/restaurants/{slug}/domains/{domainId}/verify
                  - PATCH /api/v1/partner/restaurants/{slug}/domains/{domainId}
                  - DELETE /api/v1/partner/restaurants/{slug}/domains/{domainId}
              - section: Restaurant webhooks
                skip-slug: true
                contents:
                  - GET /api/v1/partner/restaurants/{slug}/webhooks
                  - POST /api/v1/partner/restaurants/{slug}/webhooks
                  - DELETE /api/v1/partner/restaurants/{slug}/webhooks/{webhookId}
              - section: Settings
                skip-slug: true
                contents:
                  - GET /api/v1/partner/restaurants/{slug}/settings
                  - PATCH /api/v1/partner/restaurants/{slug}/settings
              - section: Opening hours
                skip-slug: true
                contents:
                  - GET /api/v1/partner/restaurants/{slug}/hours
                  - PUT /api/v1/partner/restaurants/{slug}/hours
                  - POST /api/v1/partner/restaurants/{slug}/hours/overrides
                  - PATCH /api/v1/partner/restaurants/{slug}/hours/overrides/{overrideId}
                  - DELETE /api/v1/partner/restaurants/{slug}/hours/overrides/{overrideId}
              - section: Delivery zones
                skip-slug: true
                contents:
                  - GET /api/v1/partner/restaurants/{slug}/delivery-zones
                  - POST /api/v1/partner/restaurants/{slug}/delivery-zones
                  - PATCH /api/v1/partner/restaurants/{slug}/delivery-zones/{zoneId}
                  - DELETE /api/v1/partner/restaurants/{slug}/delivery-zones/{zoneId}
              - section: Menu import
                skip-slug: true
                contents:
                  - POST /api/v1/partner/restaurants/{slug}/menu-imports
                  - GET /api/v1/partner/restaurants/{slug}/menu-imports/{importId}
                  - POST /api/v1/partner/restaurants/{slug}/menu-imports/{importId}/commit
              - section: Menus
                skip-slug: true
                contents:
                  - GET /api/v1/partner/restaurants/{slug}/menus
                  - POST /api/v1/partner/restaurants/{slug}/menus
                  - GET /api/v1/partner/restaurants/{slug}/menus/{menuId}
                  - PATCH /api/v1/partner/restaurants/{slug}/menus/{menuId}
                  - DELETE /api/v1/partner/restaurants/{slug}/menus/{menuId}
                  - PUT /api/v1/partner/restaurants/{slug}/menus/{menuId}/schedules
              - section: Categories
                skip-slug: true
                contents:
                  - POST /api/v1/partner/restaurants/{slug}/menus/{menuId}/categories
                  - PATCH /api/v1/partner/restaurants/{slug}/categories/{categoryId}
                  - DELETE /api/v1/partner/restaurants/{slug}/categories/{categoryId}
              - section: Products
                skip-slug: true
                contents:
                  - POST /api/v1/partner/restaurants/{slug}/categories/{categoryId}/products
                  - POST /api/v1/partner/restaurants/{slug}/products/batch
                  - PATCH /api/v1/partner/restaurants/{slug}/products/{productId}
                  - DELETE /api/v1/partner/restaurants/{slug}/products/{productId}
                  - POST /api/v1/partner/restaurants/{slug}/categories/{categoryId}/placements
                  - DELETE /api/v1/partner/restaurants/{slug}/categories/{categoryId}/placements/{productId}
              - section: Add-on groups
                skip-slug: true
                contents:
                  - GET /api/v1/partner/restaurants/{slug}/addon-groups
                  - POST /api/v1/partner/restaurants/{slug}/addon-groups
                  - PATCH /api/v1/partner/restaurants/{slug}/addon-groups/{groupId}
                  - DELETE /api/v1/partner/restaurants/{slug}/addon-groups/{groupId}
              - section: Your partner account
                skip-slug: true
                contents:
                  - GET /api/v1/partner/me
                  - GET /api/v1/partner/profile
                  - PATCH /api/v1/partner/profile
              - section: Brand
                skip-slug: true
                contents:
                  - GET /api/v1/partner/brand
                  - PATCH /api/v1/partner/brand
                  - POST /api/v1/partner/brand/logo
                  - POST /api/v1/partner/brand/logo-light
              - section: Sender domain
                skip-slug: true
                contents:
                  - GET /api/v1/partner/brand/sender-domain
                  - POST /api/v1/partner/brand/sender-domain
                  - POST /api/v1/partner/brand/sender-domain/verify
                  - DELETE /api/v1/partner/brand/sender-domain
              - section: News
                skip-slug: true
                contents:
                  - GET /api/v1/partner/news
                  - POST /api/v1/partner/news
                  - GET /api/v1/partner/news/{newsId}
                  - PATCH /api/v1/partner/news/{newsId}
                  - POST /api/v1/partner/news/{newsId}/publish
                  - DELETE /api/v1/partner/news/{newsId}
          - section: Webhooks
            referenced-packages:
              - webhooks
            contents: []
